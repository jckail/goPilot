# Depot CI is this repo's CI of record (JCK-2026). It replaces .github/workflows/source-contract.yml.
# Require only `depot-ci / ci-result`; it fails unless every job below succeeded.
name: depot-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: depot-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  inert-contract:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: AST-only runtime configuration tests
        run: python3 -B -m unittest discover -s tests -v
      - name: Shell syntax only
        run: bash -n ezRun.sh goHelpers/all_run.sh
      - name: Python syntax without helper imports
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for path in Path('goHelpers').glob('*.py'):
              ast.parse(path.read_text(), filename=str(path))
          PY

  # Every pushed branch must carry its Linear key (bots exempt). PR-only; pushes to the default branch skip it.
  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Branch names its Linear issue (jck-<n>)
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "branch: $HEAD_REF"
          case "$HEAD_REF" in dependabot/*|renovate/*|release-please--*) exit 0 ;; esac
          echo "$HEAD_REF" | grep -Eiq '(^|[^a-z0-9])jck-[0-9]+' || { echo "::error::Branch '$HEAD_REF' has no Linear key; use the issue's gitBranchName (jck-<n>-topic)"; exit 1; }

  # Pinned gitleaks binary (gitleaks-action demands an org license on Depot CI).
  gitleaks:
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (new commits; full history when there is no base)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          curl -fsSLo /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          if [ -n "$BASE" ] && git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            /tmp/gitleaks git --redact --no-banner --log-opts="${BASE}..HEAD" .
          else
            /tmp/gitleaks git --redact --no-banner .
          fi

  # Required verdict. Branch protection requires only `depot-ci / ci-result`.
  ci-result:
    name: ci-result
    if: always()
    needs: [inert-contract, branch-name, gitleaks]
    runs-on: depot-ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every job to succeed (skipped branch-name on push is fine)
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do case "$r" in success|skipped) ;; *) exit 1 ;; esac; done
